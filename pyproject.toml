[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anlass"
version = "0.1.0"
description = "Geerdeter Outbound-Motor: kein Kontakt ohne Anlass, keine Behauptung ohne Beleg."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
anlass = "anlass.cli:main"

[tool.setuptools.packages.find]
include = ["anlass*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
